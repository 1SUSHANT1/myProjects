<VirtualHost *:443>

    ServerName sushantadk.com
    ServerAlias www.sushantadk.com

    SSLEngine on

    SSLCertificateFile /etc/letsencrypt/live/sushantadk.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sushantadk.com/privkey.pem

    ProxyPreserveHost On

    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

</VirtualHost>
